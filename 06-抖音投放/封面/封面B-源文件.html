<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; overflow:hidden; }
  body {
    background:#F3F1EA;
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    color:#141414; position:relative;
  }
  .wrap{padding:96px 88px;height:100%;display:flex;flex-direction:column;}
  .badge{display:inline-block;align-self:flex-start;background:#141414;color:#F3F1EA;
         font-size:32px;font-weight:700;letter-spacing:3px;padding:14px 26px;}
  .main{margin-top:auto;margin-bottom:auto;}
  .num{display:flex;align-items:center;gap:18px;font-size:380px;font-weight:900;
       line-height:.84;letter-spacing:-14px;color:#141414;}
  .num em{font-style:normal;font-size:56px;font-weight:800;letter-spacing:4px;
          background:#141414;color:#F3F1EA;padding:14px 20px;border-radius:4px;}
  .l1{font-size:104px;font-weight:900;line-height:1.24;margin-top:30px;letter-spacing:-2px;}
  .l2{font-size:104px;font-weight:900;line-height:1.24;letter-spacing:-2px;color:#C2410C;}
  .steps{display:flex;gap:10px;margin-top:64px;}
  .steps i{flex:1;height:14px;background:#D8D4C8;border-radius:2px;}
  .steps i.on{background:#141414;}
  .steps i.end{background:#C2410C;}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;
        border-top:2px solid #D8D4C8;padding-top:34px;}
  .foot .t{font-size:32px;color:#6B6659;line-height:1.6;}
  .foot .b{font-size:30px;font-weight:800;color:#141414;border:2px solid #141414;padding:10px 24px;border-radius:999px;white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">从想法到提审</div>

  <div class="main">
    <div class="num">7<em>步</em></div>
    <div class="l1">每步都有产出物</div>
    <div class="l2">做完一步<br>才走下一步</div>
    <div class="steps">
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="end"></i>
    </div>
  </div>

  <div class="foot">
    <div class="t">合规 · 策略 · 设计 · 技术<br>开发 · 内容 · 提审</div>
    <div class="b">开源免费</div>
  </div>
</div>
</body>
</html>
